name: decode-assets
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build site
        run: |
          mkdir -p out/assets
          cp index.html readme.md out/
          touch out/.nojekyll
          for f in b64/*.b64; do n=$(basename "$f" .b64); base64 -d "$f" > "out/assets/$n"; done
          cp out/assets/Doble-Cosecha-N01-Q1-2027.pdf out/doble-cosecha-n01-q1-2027.pdf
      - name: Publish to gh-pages
        run: |
          cd out
          git init -b gh-pages
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -m "Publish site"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
